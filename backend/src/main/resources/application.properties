# ---- Local development (H2 in-memory database) ----
server.port=${PORT:8080}

spring.datasource.url=jdbc:h2:mem:taskflow;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false

# Return validation messages (e.g. "Title is required") to the frontend
server.error.include-message=always
server.error.include-binding-errors=never

# Origins allowed to call the API (comma-separated, wildcards allowed)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
